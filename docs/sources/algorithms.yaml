  guarantee_evidence: "auction-algorithm-1988 p.12 PROPOSITION 2「If at least one complete assignment exists, the algorithm terminates in a finite number of iterations.」より complete は complete assignment の存在を条件とする。同 p.11 PROPOSITION 1「A complete assignment obtained upon termination of the algorithm is within N-epsilon of being optimal, and is optimal if epsilon < 1/N.」より optimal は epsilon < 1/N の条件付き。"
  notes: "未割当の主体が同時に入札して価格を上げる分散的な緩和法。分散 MAPD のタスク割当と相性がよい。epsilon-complementary slackness による最適性の議論は PDF 取得後に確認すること。"

