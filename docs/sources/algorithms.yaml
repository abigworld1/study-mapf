# study-mapf アルゴリズム分類マニフェスト
#
# guarantees の記入規則（SOURCE_POLICY.md 第 7・8 条）:
#
#   true        原論文が明示的に主張している
#   false       原論文が「保証しない」と明示している。
#               ★または、原論文は主張しているが、後続の一次資料が反証している★
#   conditional 条件付きで成り立つと原論文が述べている（条件を guarantee_evidence / notes に書く）
#   unknown     原論文で確認できていない。★推測で埋めてはならない★
#
# 反証による false について:
#
#   原論文の主張が後続の査読済み一次資料に否定されている場合は false とし、
#   guarantee_evidence に「原論文の主張」と「反証した資料」の両方を、
#   どちらもページ番号つきで書く。片方だけ書いてはならない。
#   反証の根拠は必ず一次資料であること。二次資料や実装リポジトリの
#   issue コメントを根拠に false にしてはならない。
#
#   該当例: push-and-swap。原論文 p.4 Theorem 3.1 は n≤|V|-2 で完全と主張するが、
#   push-and-rotate-aamas-2013 p.1 脚注と §3（pp.2-4）が同じ条件内の反例と
#   agent 処理順依存を示している。解説ページでも両論文を併記すること。
#
# 2026-08-01 現在、PDF 本文から定理・補題を確認して 35 手法の保証を確定させた。
# 確定済みのものは guarantee_evidence に原文（英語）とページ番号を入れてある。
# 残り 55 手法は未確認のまま unknown。PDF 本文に該当する記述を見つけられなかったもので、
# 推測で埋めてはならない。
#
# 抽出コマンドの例:
#   pdftotext -q docs/papers/<id>/paper.pdf - | tr -s ' \n' ' ' \
#     | grep -oiE '(Theorem|Lemma|Corollary)[ ]+[0-9.]+[.:][^.]{0,150}\.' \
#     | grep -iE 'complete|optimal|suboptimal|guarantee|admissible'
#
# 用語の区別（第 8 条）:
#   complete            解が存在すれば必ず見つける
#   optimal             最適コストの解を返す
#   bounded_suboptimal  最適コストの w 倍以内を保証する
#   eventually optimal  時間を掛ければ最適へ収束する（optimal とは別物。conditional + notes で表す）
#
# architecture の記入規則（guarantees と同じ扱い）:
#
#   centralized           原論文が集中型として提示している
#   decentralized         原論文が分散型として提示している
#   decentralized-capable 原論文が「分散実装に向く」と述べている（分散型そのものとは別）
#   未記入                原論文で確認できていない。★推測で埋めてはならない★
#
#   「アルゴリズムの構造から見て明らかに集中型」といった推論では埋めない。
#   書く場合は architecture_evidence に原文とページ番号が必須
#   （validate-sources.mjs がエラーにする）。保証表では未記入なら行ごと出さない。
#
# 検証日: 2026-07-26 / architecture は 2026-07-27 に 3 件を確定

