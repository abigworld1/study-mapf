- id: cbs
  display_name: "CBS (Conflict-Based Search)"
  aliases: ["CBS", "Conflict-Based Search"]
  category: conflict-based-search
  problem_types: [classical-mapf]
  primary_paper_ids: [cbs-aij-2015, cbs-aaai-2012]
  implementation_repository_ids:
    [libmultirobotplanning, cbsh2-rtc, push-and-rotate-cbs-pp, mapf-icbs, hog2]
  implementation_status: runnable
  guarantees:
    complete: conditional
    optimal: true
    bounded_suboptimal: false
  guarantee_evidence: "cbs-aij-2015 p.12 Theorem 1「CBS returns an optimal solution.」/ p.12 Theorem 3「CBS will return a solution if one exists.」/ p.13 §5.2.2 は unsolvable problem の有限時間での識別（claim b）は CBS では常に成立せず、独立した solvability test が必要と明記するため、完全性を conditional とした。"
  architecture: centralized
  architecture_evidence: "cbs-aij-2015 p.3 §2.6「The scope of this paper is limited to centralized approaches」。同節は centralized を「単一の計算主体が全 agent の解を求める設定。agent ごとに CPU があっても完全な知識共有と中央の問題解決器がある場合を含む」と定義している。"
  notes: "高レベル（制約木 CT）と低レベル（単一エージェント時空間探索）の二層構造。本サイトは standard split、SOC/conflict/FIFO tie-break、CAT low-level tie-break を実装。following / disappear / diagonal と有限 maxHorizon 外は未対応。"

