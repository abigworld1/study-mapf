# study-mapf 参照実装マニフェスト
#
# ここに載るのは「読んで挙動を確かめるためだけ」の第三者リポジトリである。
# clone 先 .references/ は .gitignore 済みで、コード自体は本リポジトリへ絶対にコミットしない。
#
#   * relation: official は README・論文・著者ページ・LICENSE の著作権者名のいずれかで
#     公式実装だと確認できた場合のみ。検索で見つけただけのものは third-party、
#     研究グループが出しているが対応論文を特定しきれないものは research-reference とする。
#   * license_spdx は clone 後に実ファイルを読んで判定した値。標準ライセンスに一致しない
#     独自ライセンスは NOASSERTION、ライセンスファイルが無い場合は null。
#   * copy_allowed が true 以外のものからコードを転記してはならない（SOURCE_POLICY.md 第 9・10 条）。
#     true であっても著作権表示の保持義務は残る。
#   * pinned_commit は sync-reference-repos.sh が checkout する固定 SHA。
#     下記の値は 2026-07-26 に取得した時点の HEAD。
#
# 重要な調査結果（GitHub API のライセンス自動判定と実ファイルが食い違う例）:
#   * USC 系（pbs / eecbs / rhcr / mapf-lns / mapf-lns2 / cbsh2 / cbsh2-rtc）は MIT ではなく
#     南カリフォルニア大学の独自ライセンス。教育・研究・非営利目的に限定され、商用利用は
#     USC Stevens Center への個別連絡が必要。
#   * primal / primal2 の LICENSE.md は MIT 本文だが著作権者が ".NET Foundation and Contributors"
#     になっており、当該プロジェクトの著作権者と一致しない。定型文の混入と見られるため
#     copy_allowed は false のままにする。
#
# サブモジュールについて:
#   要件どおり sync スクリプトはサブモジュールを取得していない。以下は未取得のため
#   そのままではビルドできない: lacam0 / lacam2 / lacam3 / pibt2 / mapf-visualizer / mapf-lns-unified。
#   特に mapf-lns-unified は git@github.com: 形式の SSH サブモジュールを含み、SSH 鍵なしでは取得できない。

