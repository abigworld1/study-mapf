name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 品質ゲート
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # astro 7.1.x の engines は node >= 22.12.0
          node-version: "22"
          cache: npm

      - run: npm ci

      # 資料マニフェストの整合性。サイトはここから生成されるので先に検査する。
      - name: マニフェスト検証
        run: npm run sources:validate

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: 型検査
        run: npm run typecheck

      - name: ユニットテスト
        run: npm test

      - name: ビルド
        run: npm run build:only

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
